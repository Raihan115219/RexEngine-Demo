<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RexEngine — AI Real Estate Marketing</title>
  <meta name="description" content="RexEngine turns property listings into ready-to-publish social media marketing for Instagram, Facebook, LinkedIn, X and YouTube.">
  <meta name="theme-color" content="#EAF0F5">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233B35D6'/%3E%3Cpath d='M8 15.5 16 9l8 6.5' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M12.5 24v-7h4.3a2.6 2.6 0 0 1 0 5.2H12.5M16.6 22.2 19.5 24' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS (Play CDN) — utilities for layout; tokens mirror styles.css -->
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Lexend', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          colors: {
            navy: { DEFAULT: '#18181B', 900: '#18181B', 800: '#27272A', 700: '#3F3F46' },
            brand: { DEFAULT: '#3B35D6', 50: '#F3F2FE', 100: '#E7E6FD', 200: '#D4D2FB', 300: '#B4B0F7', 400: '#8A85F0', 500: '#5B55E6', 600: '#3B35D6', 700: '#2E28B0' },
            canvas: '#EAF0F5',
            line: '#E3E9F0',
            ink: '#111827',
            sub: '#64748B',
            muted: '#94A3B8',
          },
          boxShadow: {
            card: '0 1px 2px rgba(15,23,42,.04), 0 8px 22px -14px rgba(30,64,110,.22)',
            lift: '0 2px 6px rgba(15,23,42,.05), 0 22px 44px -20px rgba(30,64,110,.32)',
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="styles.css?v=3">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js" defer></script>
  <script src="script.js?v=4" defer></script>
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>

  <!-- Ambient background -->
  <div class="ambient" aria-hidden="true"><span class="amb amb-1"></span><span class="amb amb-2"></span><span class="amb amb-3"></span></div>

  <!-- Mobile drawer overlay -->
  <div id="sb-overlay" class="sb-overlay" data-action="close-drawer" aria-hidden="true"></div>

  <!-- Sidebar (rendered by script.js) -->
  <aside id="sidebar" class="sidebar" aria-label="Primary"></aside>

  <div class="main-wrap">
    <!-- Topbar (rendered by script.js) -->
    <header id="topbar" class="topbar"></header>

    <main id="main" tabindex="-1" class="outline-none">
      <div id="view" class="mx-auto w-full max-w-[1440px] px-4 sm:px-6 xl:px-8 py-6 sm:py-8"></div>
    </main>
  </div>

  <!-- Overlay roots -->
  <div id="modal-root"></div>
  <div id="dropdown-root"></div>
  <div id="toast-root" role="status" aria-live="polite"></div>

  <noscript>
    <div style="padding:40px;font-family:Inter,sans-serif">RexEngine demo requires JavaScript to run.</div>
  </noscript>
</body>
</html>
